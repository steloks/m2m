name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: m2m
          POSTGRES_PASSWORD: m2m
          POSTGRES_DB: m2m
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U m2m -d m2m" --health-interval 2s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://m2m:m2m@localhost:5432/m2m?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: psql "$TEST_DATABASE_URL" -f db/schema.sql
      - run: go test -race ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build .
