services:
  app:
    build: .
    environment:
      PORT: "8080"
      DEVICE_TOKEN: ${DEVICE_TOKEN:-dev-shared-token}
      DATABASE_URL: postgres://m2m:m2m@db:5432/m2m?sslmode=disable
      OFFLINE_THRESHOLD: ${OFFLINE_THRESHOLD:-5m}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: m2m
      POSTGRES_PASSWORD: m2m
      POSTGRES_DB: m2m
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m2m -d m2m"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
